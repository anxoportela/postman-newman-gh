name: Tests & Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps --no-package-lock
      - run: mkdir -p reports && npm test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-report
          path: reports/
          retention-days: 7

  docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/download-artifact@v7
        with:
          name: test-report
          path: reports/
      - run: npm install --legacy-peer-deps --no-package-lock
      - run: npm run docs:build
      - name: Copy Newman report to root
        run: |
          cp -r reports/* build/ 2>/dev/null || true
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          clean: true
