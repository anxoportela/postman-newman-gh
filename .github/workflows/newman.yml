name: Tests & Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps --no-package-lock
      - run: mkdir -p reports && npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/
          retention-days: 7

  docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: test-report
          path: reports/
      - run: npm install --legacy-peer-deps --no-package-lock
      - run: npm run docs:build
      - name: Copy Newman report to docs
        run: |
          mkdir -p build/docs
          cp -r reports/* build/docs/ 2>/dev/null || true
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          clean: true
