services:
  newman:
    build: .
    image: rick-morty-newman:latest
    volumes:
      - ./reports:/app/reports
    environment:
      - NODE_ENV=test
    profiles:
      - test

  newman-report:
    build: .
    image: rick-morty-newman:latest
    command: >
      newman run rick-and-morty-api.json 
      -e rick-and-morty-env.json 
      --reporters cli,htmlextra,json 
      --reporter-htmlextra-export reports/newman-report.html 
      --reporter-json-export reports/newman-report.json
    volumes:
      - ./reports:/app/reports
    environment:
      - NODE_ENV=test
    profiles:
      - report
